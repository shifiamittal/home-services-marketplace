name: Cloudflare production migrations

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight or guarded production apply
        required: true
        type: choice
        options:
          - preflight
          - apply
      confirmation:
        description: For apply, enter APPLY_NIVASA_PRODUCTION_MIGRATIONS
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nivasa-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: ${{ inputs.operation }} production D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      EXPECTED_ACCOUNT_ID: 0c53a1d6277d240fe99359ce0495fe9d
      EXPECTED_WORKER_NAME: nivasa-home-help
      EXPECTED_DATABASE_ID: 508b580c-9da0-41ad-97d2-4695047eb2b0
      EXPECTED_DATABASE_NAME: nivasa-production
      EXPECTED_BUCKET_NAME: nivasa-private-address-proofs
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Verify default production branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || {
            echo 'Production migrations require refs/heads/main.' >&2
            exit 1
          }
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" && "${DEFAULT_BRANCH}" == 'main' ]] || {
            echo 'Production migrations require main to be the repository default branch.' >&2
            exit 1
          }
          echo 'Default production branch verified.'

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production configuration and reviewed migrations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {
            ORDERED_MIGRATION_NAMES,
            expectedSchemaManifest,
            validateProductionConfiguration,
            validateRepositoryMigrations,
          } from './scripts/production-migration-contract.mjs';
          function stripJsonComments(source) {
            let output = '';
            let inString = false;
            let escaped = false;
            for (let index = 0; index < source.length; index += 1) {
              const character = source[index];
              const next = source[index + 1];
              if (inString) {
                output += character;
                if (escaped) escaped = false;
                else if (character === '\\') escaped = true;
                else if (character === '"') inString = false;
              } else if (character === '"') {
                inString = true;
                output += character;
              } else if (character === '/' && next === '/') {
                while (index < source.length && source[index] !== '\n') index += 1;
                output += '\n';
              } else if (character === '/' && next === '*') {
                index += 2;
                while (index < source.length && !(source[index] === '*' && source[index + 1] === '/')) {
                  if (source[index] === '\n') output += '\n';
                  index += 1;
                }
                if (index >= source.length) throw new Error('Unterminated JSONC block comment');
                index += 1;
              } else {
                output += character;
              }
            }
            if (inString) throw new Error('Unterminated JSONC string');
            return output;
          }

          const configSource = fs.readFileSync('wrangler.jsonc', 'utf8');
          const config = JSON.parse(stripJsonComments(configSource));
          validateProductionConfiguration(config, {
            workerName: process.env.EXPECTED_WORKER_NAME,
            accountId: process.env.EXPECTED_ACCOUNT_ID,
            databaseId: process.env.EXPECTED_DATABASE_ID,
            databaseName: process.env.EXPECTED_DATABASE_NAME,
            bucketName: process.env.EXPECTED_BUCKET_NAME,
          });
          console.log('Production resource configuration matches the reviewed values.');

          const migrations = validateRepositoryMigrations('drizzle');
          if (JSON.stringify(migrations) !== JSON.stringify(ORDERED_MIGRATION_NAMES)) {
            throw new Error('Authoritative migration contract is inconsistent');
          }
          const { tables, indexes } = expectedSchemaManifest(ORDERED_MIGRATION_NAMES.length);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/expected-migrations.json`, JSON.stringify(migrations));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/expected-tables.json`, JSON.stringify(tables));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/expected-indexes.json`, JSON.stringify(indexes));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/expected-config-sha256.txt`, crypto.createHash('sha256').update(configSource).digest('hex'));
          NODE

      - name: Verify authentication and read-only Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo 'CLOUDFLARE_API_TOKEN is unavailable.' >&2
            exit 1
          }

          ./node_modules/.bin/wrangler whoami | tee "${RUNNER_TEMP}/wrangler-whoami.txt"
          grep -Fq "${EXPECTED_ACCOUNT_ID}" "${RUNNER_TEMP}/wrangler-whoami.txt" || {
            echo 'Wrangler authentication does not expose the expected account.' >&2
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const accountId = process.env.EXPECTED_ACCOUNT_ID;
          const bucket = process.env.EXPECTED_BUCKET_NAME;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Cloudflare token is unavailable');

          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) throw new Error(`Cloudflare read failed with HTTP ${response.status}`);
            const body = await response.json();
            if (body.success !== true || !Array.isArray(body.errors) || body.errors.length !== 0) {
              throw new Error('Cloudflare returned an ambiguous read response');
            }
            return body;
          }

          const scripts = await get(`/accounts/${accountId}/workers/scripts`);
          if (!Array.isArray(scripts.result)) throw new Error('Workers Scripts read response was unexpected');

          const managed = await get(`/accounts/${accountId}/r2/buckets/${bucket}/domains/managed`);
          const custom = await get(`/accounts/${accountId}/r2/buckets/${bucket}/domains/custom`);
          if (typeof managed.result?.enabled !== 'boolean' || !Array.isArray(custom.result?.domains)) {
            throw new Error('R2 privacy response was unexpected');
          }

          const objects = await get(`/accounts/${accountId}/r2/buckets/${bucket}/objects?per_page=1`);
          if (!Array.isArray(objects.result)) throw new Error('R2 object-list response was unexpected');
          if (objects.result.length !== 0) throw new Error('The production R2 bucket is not empty');

          if (managed.result.enabled || custom.result.domains.length !== 0) {
            throw new Error('The production R2 bucket is publicly accessible');
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/cloudflare-readonly-state.json`, JSON.stringify({
            r2Private: true,
            r2ObjectCount: 0,
          }));
          console.log(`Workers Scripts access verified (${scripts.result.length} visible).`);
          console.log('R2 private: yes; custom domains: 0; objects: 0.');
          NODE

      - name: Run complete remote preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          wrangler=(./node_modules/.bin/wrangler)
          config=(--config wrangler.jsonc)

          "${wrangler[@]}" d1 info DB "${config[@]}" --json > "${RUNNER_TEMP}/d1-info.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const info = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/d1-info.json`, 'utf8'));
          const result = info.result ?? info;
          if (result.uuid !== process.env.EXPECTED_DATABASE_ID && result.database_id !== process.env.EXPECTED_DATABASE_ID) {
            throw new Error('Remote D1 ID did not match the reviewed database');
          }
          if (result.name !== process.env.EXPECTED_DATABASE_NAME) {
            throw new Error('Remote D1 name did not match the reviewed database');
          }
          console.log('Remote D1 identity verified.');
          NODE

          "${wrangler[@]}" d1 migrations list DB "${config[@]}" --remote \
            | tee "${RUNNER_TEMP}/pending-migrations.txt"

          "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
            --command "SELECT name,type FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type,name" \
            > "${RUNNER_TEMP}/preflight-schema.json"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parsePendingMigrationOutput } from './scripts/production-migration-contract.mjs';
          const temp = process.env.RUNNER_TEMP;
          const expectedTables = JSON.parse(fs.readFileSync(`${temp}/expected-tables.json`, 'utf8'));
          const pendingText = fs.readFileSync(`${temp}/pending-migrations.txt`, 'utf8');
          const pending = parsePendingMigrationOutput(pendingText);

          function d1Rows(path) {
            const blocks = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(blocks) || blocks.length === 0 || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
              throw new Error('D1 returned an ambiguous JSON response');
            }
            return blocks.flatMap((block) => block.results);
          }
          const schema = d1Rows(`${temp}/preflight-schema.json`);
          const tables = schema.filter((row) => row.type === 'table').map((row) => row.name);
          const indexes = schema.filter((row) => row.type === 'index').map((row) => row.name);
          const applicationTables = tables.filter((name) => name !== 'd1_migrations' && !name.startsWith('_cf_'));
          const hasLedger = tables.includes('d1_migrations');
          if (new Set(applicationTables).size !== applicationTables.length) {
            throw new Error('Remote schema contains duplicate application-table names');
          }
          const allowedTables = new Set(expectedTables);
          if (applicationTables.some((name) => !allowedTables.has(name))) {
            throw new Error('Remote application-table manifest is incomplete or unexpected');
          }

          const quoteIdentifier = (name) => `"${String(name).replaceAll('"', '""')}"`;
          const quoteLiteral = (name) => `'${String(name).replaceAll("'", "''")}'`;
          if (applicationTables.length > 0) {
            const sql = applicationTables.map((name) =>
              `SELECT ${quoteLiteral(name)} AS table_name, COUNT(*) AS row_count FROM ${quoteIdentifier(name)}`
            ).join(';\n') + ';\n';
            fs.writeFileSync(`${temp}/preflight-row-counts.sql`, sql);
          }
          fs.writeFileSync(`${temp}/preflight-state.json`, JSON.stringify({
            pending, tables, indexes, applicationTables, hasLedger, ledger: null, rowCounts: [],
          }));
          console.log(`Pending remote migrations (${pending.length}): ${pending.join(', ') || 'none'}`);
          console.log(`Remote schema: ${applicationTables.length} application tables; ${indexes.length} user-defined indexes.`);
          NODE

          if [[ -f "${RUNNER_TEMP}/preflight-row-counts.sql" ]]; then
            "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
              --file "${RUNNER_TEMP}/preflight-row-counts.sql" > "${RUNNER_TEMP}/preflight-row-counts.json"
          node <<'NODE'
          const fs = require('node:fs');
          const blocks = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/preflight-row-counts.json`, 'utf8'));
          if (!Array.isArray(blocks) || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
            throw new Error('Application row-count response was ambiguous');
          }
          const rows = blocks.flatMap((block) => block.results);
          const statePath = `${process.env.RUNNER_TEMP}/preflight-state.json`;
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const expected = state.applicationTables;
          if (!Array.isArray(expected) || rows.length !== expected.length) {
            throw new Error('Application-table row-count results are incomplete');
          }
          const names = rows.map((row) => row.table_name);
          if (names.some((name) => typeof name !== 'string') || new Set(names).size !== names.length) {
            throw new Error('Application row-count names are missing, duplicated, or malformed');
          }
          if (JSON.stringify([...names].sort()) !== JSON.stringify([...expected].sort())) {
            throw new Error('Application row-count table manifest is incomplete or unexpected');
          }
          if (rows.some((row) => !Number.isSafeInteger(row.row_count) || row.row_count < 0)) {
            throw new Error('Application row count is not a valid non-negative integer');
          }
          state.rowCounts = rows.map((row) => [row.table_name, row.row_count]).sort(([a], [b]) => a.localeCompare(b));
          fs.writeFileSync(statePath, JSON.stringify(state));
          for (const row of rows) console.log(`${row.table_name}: ${row.row_count}`);
          NODE
          else
            echo 'Application table row counts: no application tables exist.'
          fi

          if node -e "const s=require(process.env.RUNNER_TEMP + '/preflight-state.json'); process.exit(s.hasLedger ? 0 : 1)"; then
            "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
              --command "SELECT name FROM d1_migrations ORDER BY id" > "${RUNNER_TEMP}/preflight-ledger.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const temp = process.env.RUNNER_TEMP;
          const blocks = JSON.parse(fs.readFileSync(`${temp}/preflight-ledger.json`, 'utf8'));
          if (!Array.isArray(blocks) || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
            throw new Error('Migration-ledger response was ambiguous');
          }
          const ledger = blocks.flatMap((block) => block.results).map((row) => row.name);
          const state = JSON.parse(fs.readFileSync(`${temp}/preflight-state.json`, 'utf8'));
          state.ledger = ledger;
          fs.writeFileSync(`${temp}/preflight-state.json`, JSON.stringify(state));
          console.log(`Remote migration ledger entries: ${ledger.length}.`);
          NODE
          else
            echo 'Remote migration ledger: absent.'
            node -e "const fs=require('node:fs'); const p=process.env.RUNNER_TEMP + '/preflight-state.json'; const s=JSON.parse(fs.readFileSync(p)); s.ledger=[]; fs.writeFileSync(p,JSON.stringify(s))"
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { computeMigrationPlan, validateSchemaForPlan } from './scripts/production-migration-contract.mjs';
          const statePath = `${process.env.RUNNER_TEMP}/preflight-state.json`;
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const plan = computeMigrationPlan({
            ledger: state.ledger,
            pending: state.pending,
            applicationTables: state.applicationTables,
          });
          validateSchemaForPlan(plan, { applicationTables: state.applicationTables, indexes: state.indexes });
          state.plan = plan;
          fs.writeFileSync(statePath, JSON.stringify(state));
          console.log(`Validated exact migration prefix (${plan.applied.length}) and suffix (${plan.pending.length}).`);
          NODE

      - name: Enforce production apply gate
        if: ${{ inputs.operation == 'apply' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'Apply is allowed only from main.' >&2; exit 1; }
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" && "${DEFAULT_BRANCH}" == 'main' ]] || {
            echo 'Apply requires main to be the repository default branch.' >&2
            exit 1
          }
          [[ "${CONFIRMATION}" == 'APPLY_NIVASA_PRODUCTION_MIGRATIONS' ]] || {
            echo 'The production confirmation phrase did not match.' >&2
            exit 1
          }
          node -e "const s=require(process.env.RUNNER_TEMP + '/preflight-state.json'); if(!s.plan || s.plan.pending.length===0) throw new Error('Remote preflight state has no reviewed migrations to apply')"
          node -e "const s=require(process.env.RUNNER_TEMP + '/cloudflare-readonly-state.json'); if(s.r2Private!==true || s.r2ObjectCount!==0) throw new Error('R2 must be private and empty before apply')"
          echo 'Production apply gate passed.'

      - name: Apply reviewed production migrations
        if: ${{ inputs.operation == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]]
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" && "${DEFAULT_BRANCH}" == 'main' ]]
          [[ "${CONFIRMATION}" == 'APPLY_NIVASA_PRODUCTION_MIGRATIONS' ]]
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          node -e "const s=require(process.env.RUNNER_TEMP + '/cloudflare-readonly-state.json'); if(s.r2Private!==true || s.r2ObjectCount!==0) throw new Error('R2 state is not safe to apply')"

          wrangler=(./node_modules/.bin/wrangler)
          config=(--config wrangler.jsonc)
          "${wrangler[@]}" d1 info DB "${config[@]}" --json > "${RUNNER_TEMP}/fresh-d1-info.json"
          "${wrangler[@]}" d1 migrations list DB "${config[@]}" --remote \
            > "${RUNNER_TEMP}/fresh-pending-migrations.txt"
          "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
            --command "SELECT name,type FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type,name" \
            > "${RUNNER_TEMP}/fresh-schema.json"

          if node - <<'NODE'
          const fs = require('node:fs');
          const blocks = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/fresh-schema.json`, 'utf8'));
          if (!Array.isArray(blocks) || blocks.length === 0 || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) process.exit(2);
          const tables = blocks.flatMap((block) => block.results).filter((row) => row.type === 'table').map((row) => row.name);
          process.exit(tables.includes('d1_migrations') ? 0 : 1);
          NODE
          then
            "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
              --command "SELECT name FROM d1_migrations ORDER BY id" > "${RUNNER_TEMP}/fresh-ledger.json"
          else
            status=$?
            [[ "${status}" -eq 1 ]] || { echo 'Fresh D1 schema response was ambiguous.' >&2; exit 1; }
          fi

          if [[ -f "${RUNNER_TEMP}/preflight-row-counts.sql" ]]; then
            "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
              --file "${RUNNER_TEMP}/preflight-row-counts.sql" > "${RUNNER_TEMP}/fresh-row-counts.json"
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {
            computeMigrationPlan,
            parsePendingMigrationOutput,
            validateSchemaForPlan,
          } from './scripts/production-migration-contract.mjs';
          const temp = process.env.RUNNER_TEMP;
          const info = JSON.parse(fs.readFileSync(`${temp}/fresh-d1-info.json`, 'utf8'));
          const expectedConfigHash = fs.readFileSync(`${temp}/expected-config-sha256.txt`, 'utf8');
          const currentConfigHash = crypto.createHash('sha256').update(fs.readFileSync('wrangler.jsonc')).digest('hex');
          if (currentConfigHash !== expectedConfigHash) throw new Error('wrangler.jsonc changed after target validation');
          const database = info.result ?? info;
          if ((database.uuid !== process.env.EXPECTED_DATABASE_ID && database.database_id !== process.env.EXPECTED_DATABASE_ID)
              || database.name !== process.env.EXPECTED_DATABASE_NAME) {
            throw new Error('Fresh pre-apply D1 identity does not match the reviewed target');
          }

          function d1Rows(path) {
            const blocks = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(blocks) || blocks.length === 0 || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
              throw new Error('Fresh pre-apply D1 response was ambiguous');
            }
            return blocks.flatMap((block) => block.results);
          }
          const pendingText = fs.readFileSync(`${temp}/fresh-pending-migrations.txt`, 'utf8');
          const pending = parsePendingMigrationOutput(pendingText);
          const schema = d1Rows(`${temp}/fresh-schema.json`);
          const tables = schema.filter((row) => row.type === 'table').map((row) => row.name);
          const indexes = schema.filter((row) => row.type === 'index').map((row) => row.name);
          const applicationTables = tables.filter((name) => name !== 'd1_migrations' && !name.startsWith('_cf_'));
          const hasLedger = tables.includes('d1_migrations');
          const ledger = hasLedger ? d1Rows(`${temp}/fresh-ledger.json`).map((row) => row.name) : [];
          const plan = computeMigrationPlan({ ledger, pending, applicationTables });
          validateSchemaForPlan(plan, { applicationTables, indexes });
          if (plan.pending.length === 0) throw new Error('Fresh pre-apply state has no reviewed migrations to apply');
          const rowCounts = fs.existsSync(`${temp}/fresh-row-counts.json`)
            ? d1Rows(`${temp}/fresh-row-counts.json`).map((row) => [row.table_name, row.row_count]).sort(([a], [b]) => a.localeCompare(b))
            : [];
          const fresh = { pending, tables, indexes, applicationTables, hasLedger, ledger, rowCounts, plan };
          const preflight = JSON.parse(fs.readFileSync(`${temp}/preflight-state.json`, 'utf8'));
          if (JSON.stringify(fresh) !== JSON.stringify(preflight)) {
            throw new Error('Remote migration ledger, schema, pending migrations, or row-count state changed after preflight');
          }
          console.log(`Fresh pre-apply D1 state verified; applying ${plan.pending.length} ordered migration(s).`);
          NODE

          npm run cloudflare:d1:migrations:apply

      - name: Verify production migration result
        if: ${{ inputs.operation == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler=(./node_modules/.bin/wrangler)
          config=(--config wrangler.jsonc)

          "${wrangler[@]}" d1 migrations list DB "${config[@]}" --remote \
            | tee "${RUNNER_TEMP}/post-pending-migrations.txt"
          "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
            --command "SELECT name,type FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type,name" \
            > "${RUNNER_TEMP}/post-schema.json"
          "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id" > "${RUNNER_TEMP}/post-ledger.json"
          "${wrangler[@]}" d1 execute DB "${config[@]}" --remote --json \
            --command "PRAGMA foreign_key_check" > "${RUNNER_TEMP}/post-foreign-keys.json"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            parsePendingMigrationOutput,
            requireDeploymentReady,
          } from './scripts/production-migration-contract.mjs';
          const temp = process.env.RUNNER_TEMP;
          const expectedMigrations = JSON.parse(fs.readFileSync(`${temp}/expected-migrations.json`, 'utf8'));
          const expectedTables = JSON.parse(fs.readFileSync(`${temp}/expected-tables.json`, 'utf8'));
          const expectedIndexes = JSON.parse(fs.readFileSync(`${temp}/expected-indexes.json`, 'utf8'));

          function rows(name) {
            const blocks = JSON.parse(fs.readFileSync(`${temp}/${name}`, 'utf8'));
            if (!Array.isArray(blocks) || blocks.length === 0 || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
              throw new Error(`${name} was ambiguous`);
            }
            return blocks.flatMap((block) => block.results);
          }
          const pending = parsePendingMigrationOutput(fs.readFileSync(`${temp}/post-pending-migrations.txt`, 'utf8'));

          const schema = rows('post-schema.json');
          const actualTables = schema.filter((row) => row.type === 'table' && row.name !== 'd1_migrations' && !row.name.startsWith('_cf_')).map((row) => row.name).sort();
          const actualIndexes = schema.filter((row) => row.type === 'index').map((row) => row.name).sort();
          if (JSON.stringify(actualTables) !== JSON.stringify([...expectedTables].sort())) throw new Error('Production table set is unexpected');
          if (JSON.stringify(actualIndexes) !== JSON.stringify([...expectedIndexes].sort())) throw new Error('Production index set is unexpected');

          const ledger = rows('post-ledger.json').map((row) => row.name);
          requireDeploymentReady({ applied: ledger, pending });
          if (JSON.stringify(ledger) !== JSON.stringify(expectedMigrations)) throw new Error('Production migration ledger is unexpected');
          if (rows('post-foreign-keys.json').length !== 0) throw new Error('Foreign-key violations exist');

