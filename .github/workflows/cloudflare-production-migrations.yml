            if (!response.ok) throw new Error(`Cloudflare read failed with HTTP ${response.status}`);
            const body = await response.json();
            if (body.success !== true || !Array.isArray(body.errors) || body.errors.length !== 0) {
              throw new Error('Cloudflare returned an ambiguous read response');
            }
            return body;
          }
