name: Cloudflare production deployment

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight or guarded public Workers.dev deployment
        required: true
        type: choice
        options:
          - preflight
          - deploy-public
      confirmation:
        description: For deploy-public, enter DEPLOY_NIVASA_PUBLIC_WORKER
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nivasa-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: ${{ inputs.operation }} production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      EXPECTED_ACCOUNT_ID: 0c53a1d6277d240fe99359ce0495fe9d
      EXPECTED_WORKER_NAME: nivasa-home-help
      EXPECTED_DATABASE_NAME: nivasa-production
      EXPECTED_DATABASE_ID: 508b580c-9da0-41ad-97d2-4695047eb2b0
      EXPECTED_BUCKET_NAME: nivasa-private-address-proofs
      EXPECTED_WORKERS_DEV_URL: https://nivasa-home-help.nivasa-app.workers.dev
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Verify default production branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || {
            echo 'Production deployment requires refs/heads/main.' >&2
            exit 1
          }
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" && "${DEFAULT_BRANCH}" == 'main' ]] || {
            echo 'Production deployment requires main to be the default branch.' >&2
            exit 1
          }
          [[ "${REQUESTED_OPERATION}" == 'preflight' || "${REQUESTED_OPERATION}" == 'deploy-public' ]] || {
            echo 'Unexpected deployment operation.' >&2
            exit 1
          }
          echo 'Default production branch and operation verified.'

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate revision and immutable production target
        run: |
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || {
            echo 'Checked-out revision does not match the dispatched revision.' >&2
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || {
            echo 'The checked-out repository is not clean.' >&2
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {
            ORDERED_MIGRATION_NAMES,
            validateRepositoryMigrations,
          } from './scripts/production-migration-contract.mjs';

          function stripJsonComments(source) {
            let output = '';
            let inString = false;
            let escaped = false;
            for (let index = 0; index < source.length; index += 1) {
              const character = source[index];
              const next = source[index + 1];
              if (inString) {
                output += character;
                if (escaped) escaped = false;
                else if (character === '\\') escaped = true;
                else if (character === '"') inString = false;
              } else if (character === '"') {
                inString = true;
                output += character;
              } else if (character === '/' && next === '/') {
                while (index < source.length && source[index] !== '\n') index += 1;
                output += '\n';
              } else if (character === '/' && next === '*') {
                index += 2;
                while (index < source.length && !(source[index] === '*' && source[index + 1] === '/')) index += 1;
                if (index >= source.length) throw new Error('Unterminated JSONC block comment');
                index += 1;
              } else output += character;
            }
            if (inString) throw new Error('Unterminated JSONC string');
            return output;
          }

          const source = fs.readFileSync('wrangler.jsonc', 'utf8');
          const migrationNames = validateRepositoryMigrations('drizzle');
          if (JSON.stringify(migrationNames) !== JSON.stringify(ORDERED_MIGRATION_NAMES)) {
            throw new Error('Authoritative migration contract is inconsistent');
          }
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/nivasa-expected-migrations.json`,
            JSON.stringify(migrationNames),
            { mode: 0o600 },
          );
          const config = JSON.parse(stripJsonComments(source));
          const database = config.d1_databases?.find((item) => item.binding === 'DB');
          const bucket = config.r2_buckets?.find((item) => item.binding === 'BUCKET');
          const checks = [
            [config.name, process.env.EXPECTED_WORKER_NAME, 'Worker name'],
            [config.account_id, process.env.EXPECTED_ACCOUNT_ID, 'account ID'],
            [config.main, './worker/index.ts', 'Worker entry point'],
            [database?.database_name, process.env.EXPECTED_DATABASE_NAME, 'D1 database name'],
            [database?.database_id, process.env.EXPECTED_DATABASE_ID, 'D1 database ID'],
            [bucket?.bucket_name, process.env.EXPECTED_BUCKET_NAME, 'R2 bucket name'],
            [config.assets?.binding, 'ASSETS', 'Assets binding'],
            [config.images?.binding, 'IMAGES', 'Images binding'],
            [config.workers_dev, true, 'Workers.dev setting'],
            [config.preview_urls, false, 'preview URL setting'],
          ];
          for (const [actual, expected, label] of checks) {
            if (actual !== expected) throw new Error(`Unexpected ${label}`);
          }
          if (Object.hasOwn(config, 'routes') || Object.hasOwn(config, 'route')) {
            throw new Error('Production configuration must not declare routes or custom domains');
          }
          if (config.d1_databases?.filter((item) => item.binding === 'DB').length !== 1
              || config.r2_buckets?.filter((item) => item.binding === 'BUCKET').length !== 1) {
            throw new Error('Production storage bindings are missing or duplicated');
          }
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/nivasa-reviewed-config.sha256`,
            crypto.createHash('sha256').update(source).digest('hex'),
            { mode: 0o600 },
          );
          const publicUrl = new URL(process.env.EXPECTED_WORKERS_DEV_URL);
          if (publicUrl.protocol !== 'https:' || publicUrl.hostname !== 'nivasa-home-help.nivasa-app.workers.dev'
              || publicUrl.pathname !== '/' || publicUrl.search || publicUrl.hash) {
            throw new Error('Unexpected Workers.dev production URL');
          }
          console.log('Immutable public production target verified.');
          NODE

      - name: Run local production validation without credentials
        run: |
          npm test
          npx tsc --noEmit
          npx eslint worker/index.ts worker/production-readiness.mjs vite.config.ts tests/production-readiness.test.mjs
          npm run build:production
          npm run cloudflare:deploy:dry-run
          grep -Eq 'productionReadinessResponse\(request, env, true\)' dist/server/index.js || {
            echo 'The production readiness gate is not enabled in the built Worker.' >&2
            exit 1
          }
          if grep -Eq 'productionReadinessResponse\(request, env, false\)' dist/server/index.js; then
            echo 'The production Worker contains a disabled readiness gate.' >&2
            exit 1
          fi
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const generated = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          const deploy = JSON.parse(fs.readFileSync('.wrangler/deploy/config.json', 'utf8'));
          const database = generated.d1_databases?.find((item) => item.binding === 'DB');
          const bucket = generated.r2_buckets?.find((item) => item.binding === 'BUCKET');
          const checks = [
            [generated.name, process.env.EXPECTED_WORKER_NAME],
            [generated.account_id, process.env.EXPECTED_ACCOUNT_ID],
            [generated.main, 'index.js'],
            [generated.workers_dev, true],
            [generated.preview_urls, false],
            [generated.assets?.binding, 'ASSETS'],
            [generated.images?.binding, 'IMAGES'],
            [database?.database_name, process.env.EXPECTED_DATABASE_NAME],
            [database?.database_id, process.env.EXPECTED_DATABASE_ID],
            [bucket?.bucket_name, process.env.EXPECTED_BUCKET_NAME],
          ];
          if (checks.some(([actual, expected]) => actual !== expected)) throw new Error('Generated deployment target is unexpected');
          if (Object.hasOwn(generated, 'routes') || Object.hasOwn(generated, 'route')
              || Object.keys(generated.triggers ?? {}).length !== 0) throw new Error('Generated deployment contains a public trigger');
          if (typeof deploy.configPath !== 'string'
              || !deploy.configPath.replaceAll('\\', '/').endsWith('dist/server/wrangler.json')) {
            throw new Error('Wrangler deployment redirect is unexpected');
          }
          console.log('Generated public Workers.dev configuration verified.');
          NODE
          artifact_hash="$(find dist .wrangler/deploy/config.json -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          artifact_hash="${artifact_hash%% *}"
          printf '%s' "${artifact_hash}" > "${RUNNER_TEMP}/nivasa-reviewed-artifact.sha256"
          chmod 600 "${RUNNER_TEMP}/nivasa-reviewed-artifact.sha256"
          echo 'Production build, tests, static checks, dry run, and readiness gate passed.'

      - name: Run workflow safety simulations
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/cloudflare-production-deployment.yml', 'utf8');
          const reviewedWorkflow = workflow.replace(
            /      - name: Run workflow safety simulations[\s\S]*?(?=\n      - name:)/,
            '',
          );
          const allowed = (ref, defaultBranch) => ref === 'refs/heads/main' && defaultBranch === 'main';
          const confirmed = (operation, phrase) => operation !== 'deploy-public'
            || phrase === 'DEPLOY_NIVASA_PUBLIC_WORKER';
          const requiredNames = [
            'NIVASA_SESSION_SECRET', 'MSG91_AUTH_KEY', 'VAPID_PRIVATE_JWK',
            'NEXT_PUBLIC_MSG91_WIDGET_ID', 'NEXT_PUBLIC_MSG91_WIDGET_TOKEN',
            'GOOGLE_MAPS_BROWSER_KEY', 'VAPID_PUBLIC_KEY', 'VAPID_SUBJECT',
          ];
          const targetMatches = (target) => target.account === '0c53a1d6277d240fe99359ce0495fe9d'
            && target.worker === 'nivasa-home-help'
            && target.database === '508b580c-9da0-41ad-97d2-4695047eb2b0'
            && target.bucket === 'nivasa-private-address-proofs';
          const isNonArrayObject = (value) => value !== null
            && typeof value === 'object' && !Array.isArray(value);
          const domainEnvelopeDiagnostic = (status, body, write) => {
            const jsonIsNonArrayObject = isNonArrayObject(body);
            const successExists = jsonIsNonArrayObject && Object.hasOwn(body, 'success');
            const successIsTrue = successExists && body.success === true;
            const errorsExists = jsonIsNonArrayObject && Object.hasOwn(body, 'errors');
            const errorsIsArray = errorsExists && Array.isArray(body.errors);
            const errorsIsNull = errorsExists && body.errors === null;
            const errorsIsNonArrayObject = errorsExists && isNonArrayObject(body.errors);
            const resultExists = jsonIsNonArrayObject && Object.hasOwn(body, 'result');
            const resultInfoExists = jsonIsNonArrayObject && Object.hasOwn(body, 'result_info');
            const diagnostic = {
              httpStatus: status,
              jsonIsNonArrayObject,
              successExists,
              successIsTrue,
              errorsExists,
              errorsIsArray,
              errorsIsNull,
              errorsIsNonArrayObject,
              errorsIsString: errorsExists && typeof body.errors === 'string',
              errorsIsNumber: errorsExists && typeof body.errors === 'number',
              errorsIsBoolean: errorsExists && typeof body.errors === 'boolean',
              resultExists,
              resultIsArray: resultExists && Array.isArray(body.result),
              resultInfoExists,
              resultInfoIsNonArrayObject: resultInfoExists && isNonArrayObject(body.result_info),
            };
            if (errorsIsArray) diagnostic.errorsLength = body.errors.length;
            if (errorsIsNonArrayObject) {
              diagnostic.errorsObjectOwnPropertyCount = Object.getOwnPropertyNames(body.errors).length;
            }
            if (!successIsTrue || (errorsIsArray && body.errors.length !== 0)) {
              const validCodes = errorsIsArray && body.errors.length !== 0
                && body.errors.every((error) => isNonArrayObject(error)
                  && Number.isSafeInteger(error.code) && error.code >= 1000);
              diagnostic.validNumericErrorCodesAvailable = validCodes;
              if (validCodes) diagnostic.numericErrorCodes = body.errors.map((error) => error.code);
            }
            write(`Cloudflare custom-domain envelope diagnostic: ${JSON.stringify(diagnostic)}`);
          };
          const errorsAreSemanticallyEmpty = (body) => isNonArrayObject(body)
            && Object.hasOwn(body, 'errors')
            && (Array.isArray(body.errors)
              ? body.errors.length === 0
              : body.errors === null
                || (isNonArrayObject(body.errors)
                  && Object.getOwnPropertyNames(body.errors).length === 0));
          const envelope = (body, diagnosticOptions) => {
            if (!isNonArrayObject(body) || body.success !== true || !errorsAreSemanticallyEmpty(body)) {
              if (diagnosticOptions) {
                domainEnvelopeDiagnostic(diagnosticOptions.status, body, diagnosticOptions.write);
              }
              throw new Error('Ambiguous API envelope');
            }
            return body;
          };
          const workers = (body, target) => {
            envelope(body);
            if (!Array.isArray(body.result)) throw new Error('Malformed Workers result');
            for (const item of body.result) {
              if (!item || typeof item !== 'object' || Array.isArray(item)
                  || (item.id !== undefined && (typeof item.id !== 'string' || item.id.length === 0))) {
                throw new Error('Malformed Worker item');
              }
            }
            const matches = body.result.filter((item) => item.id === target);
            if (matches.length > 1) throw new Error('Duplicate Worker');
            if (matches.length === 0) return null;
            const routes = matches[0].routes;
            if (routes !== undefined && routes !== null && !Array.isArray(routes)) {
              throw new Error('Malformed Worker routes');
            }
            if (Array.isArray(routes) && routes.length !== 0) throw new Error('Worker route exists');
            return matches[0];
          };
          const domains = (body, target, status = 200, write = () => {}) => {
            envelope(body, { status, write });
            if (!Array.isArray(body.result)) throw new Error('Malformed domains result');
            const info = body.result_info;
            if (info !== undefined) {
              if (!info || typeof info !== 'object' || Array.isArray(info)) throw new Error('Malformed domains result_info');
              for (const field of ['page', 'per_page', 'count', 'total_count', 'total_pages']) {
                if (info[field] !== undefined && (!Number.isInteger(info[field]) || info[field] < 0)) {
                  throw new Error('Malformed domains pagination metadata');
                }
              }
            }
            for (const domain of body.result) {
              if (!domain || typeof domain !== 'object' || Array.isArray(domain)
                  || domain.service !== target) {
                throw new Error('Malformed domain item');
              }
            }
            if (body.result.length !== 0) throw new Error('Worker domain exists');
            if ((info?.count ?? 0) > 0) {
              throw new Error('Contradictory domains result count');
            }
            return body.result;
          };
          const versions = (body) => {
            envelope(body);
            if (!body.result || typeof body.result !== 'object' || Array.isArray(body.result)
                || !Array.isArray(body.result.items)) throw new Error('Malformed versions result');
            const ids = [];
            for (const item of body.result.items) {
              if (!item || typeof item !== 'object' || Array.isArray(item)) throw new Error('Malformed version item');
              if (item.id !== undefined) {
                if (typeof item.id !== 'string' || item.id.length === 0) throw new Error('Malformed version ID');
                ids.push(item.id);
              }
            }
            if (new Set(ids).size !== ids.length) throw new Error('Duplicate version ID');
            if (body.result.items.length > 0
                && (typeof body.result.items[0].id !== 'string' || body.result.items[0].id.length === 0)) {
              throw new Error('Latest version ID is unavailable');
            }
            return body.result.items[0]?.id ?? null;
          };
          const workerAllowed = (state, access, requireAllSecrets = false) => {
            if (!state.exists) return false;
            if (state.previews || state.domains !== 0 || !state.r2Private) return false;
            if (access === 'private' && state.workersDev) return false;
            if (access === 'public' && !state.workersDev) return false;
            if (!state.bindings) return false;
            const names = [...state.secrets].sort();
            if (new Set(names).size !== names.length || names.some((name) => !requiredNames.includes(name))) return false;
            return !requireAllSecrets || JSON.stringify(names) === JSON.stringify([...requiredNames].sort());
          };
          assert.equal(allowed('refs/heads/main', 'main'), true);
          assert.equal(allowed('refs/heads/feature', 'main'), false);
          assert.equal(confirmed('deploy-public', ''), false);
          assert.equal(confirmed('deploy-public', 'DEPLOY_NIVASA_PUBLIC_WORKER'), true);
          assert.equal(confirmed('preflight', ''), true);
          assert.equal(requiredNames.every((name) => ({ ...Object.fromEntries(requiredNames.map((item) => [item, 'present'])) })[name]), true);
          assert.equal(requiredNames.every((name) => ({ NIVASA_SESSION_SECRET: 'present' })[name]), false);
          assert.equal(targetMatches({
            account: '0c53a1d6277d240fe99359ce0495fe9d', worker: 'nivasa-home-help',
            database: '508b580c-9da0-41ad-97d2-4695047eb2b0', bucket: 'nivasa-private-address-proofs',
          }), true);
          const reviewedTarget = {
            account: '0c53a1d6277d240fe99359ce0495fe9d', worker: 'nivasa-home-help',
            database: '508b580c-9da0-41ad-97d2-4695047eb2b0', bucket: 'nivasa-private-address-proofs',
          };
          for (const key of Object.keys(reviewedTarget)) {
            assert.equal(targetMatches({ ...reviewedTarget, [key]: 'wrong' }), false);
          }
          const ok = (result) => ({ success: true, errors: [], result });
          for (const errors of [[], null, {}]) {
            assert.equal(envelope({ success: true, errors, result: [] }).success, true);
            assert.equal(workers({ success: true, errors, result: [] }, 'nivasa-home-help'), null);
            assert.equal(versions({ success: true, errors, result: { items: [] } }), null);
            assert.deepEqual(domains(
              { success: true, errors, result: [] },
              'nivasa-home-help', 200, () => assert.fail(),
            ), []);
          }
          const rejectedErrors = [
            [null], { unexpected: 'value' }, 'error', 1, true, false,
          ];
          for (const errors of rejectedErrors) {
            assert.throws(() => envelope({ success: true, errors, result: [] }));
            assert.throws(() => versions({ success: true, errors, result: { items: [] } }));
            assert.throws(() => domains({ success: true, errors, result: [] }, 'nivasa-home-help'));
          }
          assert.throws(() => envelope({ success: true, result: [] }));
          assert.throws(() => versions({ success: true, result: { items: [] } }));
          assert.throws(() => domains({ success: true, result: [] }, 'nivasa-home-help'));
          assert.equal(workers(ok([]), 'nivasa-home-help'), null);
          assert.equal(workers(ok([{ id: 'nivasa-home-help', routes: [] }]), 'nivasa-home-help').id, 'nivasa-home-help');
          assert.equal(workers(ok([{ id: 'nivasa-home-help' }]), 'nivasa-home-help').id, 'nivasa-home-help');
          assert.equal(workers(ok([{ id: 'nivasa-home-help', routes: null }]), 'nivasa-home-help').id, 'nivasa-home-help');
          assert.throws(() => workers(ok([{ id: 'nivasa-home-help', routes: {} }]), 'nivasa-home-help'));
          assert.throws(() => workers(ok([{ id: 'nivasa-home-help', routes: 'none' }]), 'nivasa-home-help'));
          assert.throws(() => workers(ok([{ id: 'nivasa-home-help', routes: 0 }]), 'nivasa-home-help'));
          assert.throws(() => workers(ok([{ id: 'nivasa-home-help', routes: false }]), 'nivasa-home-help'));
          assert.throws(() => workers(ok([{ id: 'nivasa-home-help', routes: [{ id: 'route', pattern: 'example.com/*', script: 'nivasa-home-help' }] }]), 'nivasa-home-help'));
          assert.throws(() => workers(ok([{ id: 'nivasa-home-help', routes: [] }, { id: 'nivasa-home-help', routes: [] }]), 'nivasa-home-help'));
          assert.throws(() => workers(ok([null]), 'nivasa-home-help'));
          assert.deepEqual(domains(ok([]), 'nivasa-home-help'), []);
          assert.deepEqual(domains(
            { success: true, errors: null, result: [] },
            'nivasa-home-help', 200, () => assert.fail(),
          ), []);
          assert.deepEqual(domains(
            { success: true, errors: {}, result: [] },
            'nivasa-home-help', 200, () => assert.fail(),
          ), []);
          assert.deepEqual(domains({
            success: true, errors: [], result: [],
            result_info: { page: 1, per_page: 50, count: 0, total_count: 0, total_pages: 0 },
          }, 'nivasa-home-help'), []);
          assert.throws(() => domains(ok([{ service: 'nivasa-home-help' }]), 'nivasa-home-help'));
          assert.throws(() => domains(ok([{ service: 'unrelated-worker' }]), 'nivasa-home-help'));
          assert.throws(() => domains(ok({}), 'nivasa-home-help'));
          assert.throws(() => domains(ok([{}]), 'nivasa-home-help'));
          assert.throws(() => domains({ success: true, errors: [], result: [], result_info: [] }, 'nivasa-home-help'));
          assert.throws(() => domains({ success: true, errors: [], result: [], result_info: { count: -1 } }, 'nivasa-home-help'));
          assert.throws(() => domains({ success: true, errors: [], result: [], result_info: { count: 1 } }, 'nivasa-home-help'));
          assert.deepEqual(domains({
            success: true, errors: [], result: [], result_info: { count: 0, total_count: 1 },
          }, 'nivasa-home-help'), []);
          assert.throws(() => domains({ success: false, errors: [], result: [] }, 'nivasa-home-help'));
          assert.throws(() => domains({ success: true, errors: [] }, 'nivasa-home-help'));
          const sentinel = 'PROHIBITED_SECRET_AND_DOMAIN_SENTINEL';
          const prohibitedKey = 'PROHIBITED_OBJECT_KEY';
          const captureDiagnostic = (body, status = 200) => {
            const output = [];
            assert.throws(() => domains(body, 'nivasa-home-help', status, (line) => output.push(line)));
            assert.equal(output.length, 1);
            assert.equal(output[0].includes(sentinel), false);
            assert.equal(output[0].includes(prohibitedKey), false);
            const prefix = 'Cloudflare custom-domain envelope diagnostic: ';
            assert.equal(output[0].startsWith(prefix), true);
            return JSON.parse(output[0].slice(prefix.length));
          };
          assert.deepEqual(domains(ok([]), 'nivasa-home-help', 200, () => assert.fail()), []);
          const unsuccessful = captureDiagnostic({
            success: false, errors: [{ code: 1000, message: sentinel }], result: [],
            extra: { hidden: sentinel }, headers: { [prohibitedKey]: sentinel },
            credentials: { token: sentinel }, responseBody: sentinel,
          }, 207);
          assert.equal(unsuccessful.httpStatus, 207);
          assert.equal(unsuccessful.successExists, true);
          assert.equal(unsuccessful.successIsTrue, false);
          assert.equal(unsuccessful.errorsIsArray, true);
          assert.equal(unsuccessful.errorsLength, 1);
          assert.deepEqual(unsuccessful.numericErrorCodes, [1000]);
          assert.equal(captureDiagnostic(sentinel).jsonIsNonArrayObject, false);
          assert.equal(captureDiagnostic([sentinel]).jsonIsNonArrayObject, false);
          assert.equal(captureDiagnostic({ errors: [], result: [] }).successExists, false);
          assert.equal(captureDiagnostic({ success: true, result: [] }).errorsExists, false);
          assert.equal(captureDiagnostic({ success: true, errors: sentinel, result: [] }).errorsIsArray, false);
          const populatedObjectErrors = captureDiagnostic({
            success: true,
            errors: {
              [prohibitedKey]: sentinel,
              nested: { deeper: [{ value: sentinel, [prohibitedKey]: sentinel }] },
            },
            result: [],
          });
          assert.equal(populatedObjectErrors.errorsIsNonArrayObject, true);
          assert.equal(populatedObjectErrors.errorsObjectOwnPropertyCount, 2);
          assert.equal(JSON.stringify(populatedObjectErrors).includes('nested'), false);
          assert.throws(() => domains({ success: true, errors: [null], result: [] }, 'nivasa-home-help'));
          assert.equal(captureDiagnostic({ success: true, errors: sentinel, result: [] }).errorsIsString, true);
          assert.equal(captureDiagnostic({ success: true, errors: 7, result: [] }).errorsIsNumber, true);
          assert.equal(captureDiagnostic({ success: true, errors: false, result: [] }).errorsIsBoolean, true);
          assert.deepEqual(domains(ok([]), 'nivasa-home-help', 200, () => assert.fail()), []);
          assert.deepEqual(captureDiagnostic({
            success: true, errors: [{ code: 1001, message: sentinel }], result: [{ hostname: sentinel }],
          }).numericErrorCodes, [1001]);
          const malformedCodes = captureDiagnostic({
            success: false, errors: [{ code: '1000', message: sentinel }], result: sentinel,
            result_info: [sentinel],
          });
          assert.equal(malformedCodes.validNumericErrorCodesAvailable, false);
          assert.equal(Object.hasOwn(malformedCodes, 'numericErrorCodes'), false);
          assert.equal(malformedCodes.resultIsArray, false);
          assert.equal(malformedCodes.resultInfoIsNonArrayObject, false);
          assert.throws(() => domains({ success: true, errors: [] }, 'nivasa-home-help', 200, () => assert.fail()));
          assert.throws(() => domains(ok({}), 'nivasa-home-help', 200, () => assert.fail()));
          assert.deepEqual(domains(ok([]), 'nivasa-home-help', 200, () => assert.fail()), []);
          assert.deepEqual(domains({
            success: true, errors: [], result: [], result_info: {},
          }, 'nivasa-home-help', 200, () => assert.fail()), []);
          assert.throws(() => domains({
            success: true, errors: [], result: [], result_info: sentinel,
          }, 'nivasa-home-help', 200, () => assert.fail()));
          assert.equal(versions(ok({ items: [{ id: 'latest' }, { id: 'older' }] })), 'latest');
          assert.equal(versions(ok({ items: [] })), null);
          assert.throws(() => versions({ success: true, errors: [] }));
          assert.throws(() => versions(ok([])));
          assert.throws(() => versions(ok({})));
          assert.throws(() => versions(ok({ items: {} })));
          assert.throws(() => versions(ok({ items: [null] })));
          assert.throws(() => versions(ok({ items: [{}] })));
          assert.throws(() => versions(ok({ items: [{ id: '' }] })));
          assert.throws(() => versions(ok({ items: [{ id: 'same' }, { id: 'same' }] })));
          assert.equal(workerAllowed({ exists: false }, 'private', true), false);
          const reviewedPrivateWorker = {
            exists: true, workersDev: false, previews: false, domains: 0,
            r2Private: true, bindings: true, secrets: requiredNames,
          };
          assert.equal(workerAllowed(reviewedPrivateWorker, 'private', true), true);
          const reviewedPublicWorker = { ...reviewedPrivateWorker, workersDev: true };
          assert.equal(workerAllowed(reviewedPublicWorker, 'public', true), true);
          assert.equal(workerAllowed(reviewedPrivateWorker, 'public', true), false);
          assert.equal(workerAllowed({ ...reviewedPublicWorker, bindings: false }, 'public', true), false);
          assert.equal(workerAllowed({ ...reviewedPublicWorker, previews: true }, 'public', true), false);
          assert.equal(workerAllowed({ ...reviewedPublicWorker, domains: 1 }, 'public', true), false);
          assert.equal(workerAllowed({ ...reviewedPublicWorker, r2Private: false }, 'public', true), false);
          assert.equal(workerAllowed({ ...reviewedPrivateWorker, secrets: requiredNames.slice(1) }, 'private', true), false);
          assert.equal(workerAllowed({ ...reviewedPrivateWorker, secrets: [...requiredNames, 'UNEXPECTED'] }, 'private', true), false);
          assert.match(workflow, /environment:\s*production/);
          assert.match(workflow, /if:\s*\$\{\{ github\.ref == 'refs\/heads\/main' \}\}/);
          assert.doesNotMatch(reviewedWorkflow, /wrangler\s+d1\s+migrations\s+apply/);
          assert.doesNotMatch(reviewedWorkflow, /wrangler\s+r2\s+object\s+(put|delete)/);
          assert.doesNotMatch(reviewedWorkflow, /wrangler\s+(?:routes?|domains?)\s/);
          assert.match(workflow, /\[config\.workers_dev, true, 'Workers\.dev setting'\]/);
          assert.match(workflow, /\[config\.preview_urls, false, 'preview URL setting'\]/);
          assert.doesNotMatch(reviewedWorkflow, /set\s+-x|ACTIONS_STEP_DEBUG|::set-output/);
          assert.doesNotMatch(reviewedWorkflow, /save-state|GITHUB_STEP_SUMMARY|upload-artifact/);
          assert.doesNotMatch(reviewedWorkflow, /console\.(log|error)\([^\n]*process\.env/);
          assert.doesNotMatch(reviewedWorkflow, /echo[^\n]*\$\{(?:CLOUDFLARE|NIVASA|MSG91|VAPID|NEXT_PUBLIC|GOOGLE)/);
          assert.match(reviewedWorkflow, /- name: Remove temporary deployment material[\s\S]*?if:\s*\$\{\{ always\(\) \}\}[\s\S]*?rm -f --/);
          assert.doesNotMatch(reviewedWorkflow, /wrangler secret (bulk|put|delete)|--secrets-file/);
          assert.match(reviewedWorkflow, /if \[\[ "\$\{REQUESTED_OPERATION\}" == 'preflight' \]\];[\s\S]*?exit 0[\s\S]*?wrangler deploy --strict/);
          assert.match(
            reviewedWorkflow,
            /get\(\s*`\/accounts\/\$\{account\}\/workers\/domains\?service=\$\{encodeURIComponent\(worker\)\}`,\s*false,\s*true,\s*\)/,
          );
          assert.equal(reviewedWorkflow.includes("get(`/accounts/${account}/workers/domains`)"), false);
          // Exercise the production parser itself, not a duplicate implementation.
          const namespaceSource = reviewedWorkflow.match(/function parseAccountSubdomain\(body, workerName\) \{[\s\S]*?\n          \}/)?.[0];
          assert.ok(namespaceSource);
          const parseNamespace = new Function(`${namespaceSource}; return parseAccountSubdomain;`)();
          const namespace = (body, status = 200) => {
            if (status < 200 || status >= 300) throw new Error('HTTP failure');
            return parseNamespace(envelope(body), 'nivasa-home-help');
          };
          const validNamespace = ok({ subdomain: 'nivasa-app' });
          assert.equal(namespace(validNamespace), 'https://nivasa-home-help.nivasa-app.workers.dev');
          for (const result of [undefined, null, [], 'nivasa-app', 1, true, {},
            ...[null, '', ' ', 'wrong', 1, false, [], {}].map((subdomain) => ({ subdomain }))]) {
            assert.throws(() => namespace(ok(result)));
          }
          for (const body of [null, [], 'invalid', {}, { success: true, result: validNamespace.result },
            { ...validNamespace, success: false }, { ...validNamespace, errors: ['error'] }]) {
            assert.throws(() => namespace(body));
          }
          assert.throws(() => namespace(validNamespace, 403));
          assert.throws(() => namespace(JSON.parse('{')));
          assert.throws(() => parseNamespace(validNamespace, 'wrong-worker'));
          const simulateStages = (bodies, deploy) => {
            namespace(bodies[0]); // initial/preflight
            namespace(bodies[1]); // fresh, before mutation
            deploy();
            return namespace(bodies[2]); // final verification
          };
          let deployed = false;
          const wrongNamespace = ok({ subdomain: 'wrong' });
          assert.throws(() => simulateStages([validNamespace, wrongNamespace, validNamespace], () => { deployed = true; }));
          assert.equal(deployed, false);
          assert.throws(() => simulateStages([validNamespace, validNamespace, wrongNamespace], () => { deployed = true; }));
          assert.equal(deployed, true);
          assert.equal(simulateStages([validNamespace, validNamespace, validNamespace], () => {}),
            'https://nivasa-home-help.nivasa-app.workers.dev');
          assert.ok(reviewedWorkflow.includes('parseAccountSubdomain(await get(`/accounts/${account}/workers/subdomain`), worker)'));
          for (const stage of ['preflight', 'fresh', 'final']) {
            assert.match(reviewedWorkflow, new RegExp(`STATE_PATH="\\$\\{RUNNER_TEMP\\}/nivasa-${stage}-state\\.json"[^\\n]*\\\\\\n\\s*node "\\$\\{RUNNER_TEMP\\}/nivasa-inspect-cloudflare\\.mjs"`));
          }
          console.log('Static workflow security boundaries verified.');
          NODE

      - name: Require explicit public-deployment confirmation
        if: ${{ inputs.operation == 'deploy-public' }}
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "${DEPLOY_CONFIRMATION}" == 'DEPLOY_NIVASA_PUBLIC_WORKER' ]] || {
            echo 'The exact public-deployment confirmation phrase is required.' >&2
            exit 1
          }
          echo 'Public-deployment confirmation verified.'

      - name: Authenticate, preflight, and deploy publicly when requested
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo 'Cloudflare authentication is unavailable.' >&2
            exit 1
          }

          cat > "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs" <<'NODE'
          import fs from 'node:fs';
          const base = 'https://api.cloudflare.com/client/v4';
          const account = process.env.EXPECTED_ACCOUNT_ID;
          const worker = process.env.EXPECTED_WORKER_NAME;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const expectedSecrets = [
            'GOOGLE_MAPS_BROWSER_KEY', 'MSG91_AUTH_KEY', 'NEXT_PUBLIC_MSG91_WIDGET_ID',
            'NEXT_PUBLIC_MSG91_WIDGET_TOKEN', 'NIVASA_SESSION_SECRET',
            'VAPID_PRIVATE_JWK', 'VAPID_PUBLIC_KEY', 'VAPID_SUBJECT',
          ];
          if (!token) throw new Error('Cloudflare authentication is unavailable');

          const isNonArrayObject = (value) => value !== null
            && typeof value === 'object' && !Array.isArray(value);

          function reportCustomDomainEnvelope(status, body) {
            const jsonIsNonArrayObject = isNonArrayObject(body);
            const successExists = jsonIsNonArrayObject && Object.hasOwn(body, 'success');
            const successIsTrue = successExists && body.success === true;
            const errorsExists = jsonIsNonArrayObject && Object.hasOwn(body, 'errors');
            const errorsIsArray = errorsExists && Array.isArray(body.errors);
            const errorsIsNull = errorsExists && body.errors === null;
            const errorsIsNonArrayObject = errorsExists && isNonArrayObject(body.errors);
            const resultExists = jsonIsNonArrayObject && Object.hasOwn(body, 'result');
            const resultInfoExists = jsonIsNonArrayObject && Object.hasOwn(body, 'result_info');
            const diagnostic = {
              httpStatus: status,
              jsonIsNonArrayObject,
              successExists,
              successIsTrue,
              errorsExists,
              errorsIsArray,
              errorsIsNull,
              errorsIsNonArrayObject,
              errorsIsString: errorsExists && typeof body.errors === 'string',
              errorsIsNumber: errorsExists && typeof body.errors === 'number',
              errorsIsBoolean: errorsExists && typeof body.errors === 'boolean',
              resultExists,
              resultIsArray: resultExists && Array.isArray(body.result),
              resultInfoExists,
              resultInfoIsNonArrayObject: resultInfoExists && isNonArrayObject(body.result_info),
            };
            if (errorsIsArray) diagnostic.errorsLength = body.errors.length;
            if (errorsIsNonArrayObject) {
              diagnostic.errorsObjectOwnPropertyCount = Object.getOwnPropertyNames(body.errors).length;
            }
            if (!successIsTrue || (errorsIsArray && body.errors.length !== 0)) {
              const validCodes = errorsIsArray && body.errors.length !== 0
                && body.errors.every((error) => isNonArrayObject(error)
                  && Number.isSafeInteger(error.code) && error.code >= 1000);
              diagnostic.validNumericErrorCodesAvailable = validCodes;
              if (validCodes) diagnostic.numericErrorCodes = body.errors.map((error) => error.code);
            }
            console.error(`Cloudflare custom-domain envelope diagnostic: ${JSON.stringify(diagnostic)}`);
          }

          async function get(path, allowNotFound = false, diagnoseCustomDomain = false) {
            const response = await fetch(`${base}${path}`, { headers: { Authorization: `Bearer ${token}` } });
            if (allowNotFound && response.status === 404) return null;
            if (!response.ok) throw new Error(`Cloudflare read failed with HTTP ${response.status}`);
            const body = await response.json();
            const validBody = isNonArrayObject(body);
            const errorsAreEmpty = validBody && Object.hasOwn(body, 'errors')
              && (Array.isArray(body.errors)
                ? body.errors.length === 0
                : body.errors === null
                  || (isNonArrayObject(body.errors)
                    && Object.getOwnPropertyNames(body.errors).length === 0));
            const accepted = validBody && body.success === true && errorsAreEmpty;
            if (!accepted) {
              if (diagnoseCustomDomain) reportCustomDomainEnvelope(response.status, body);
              throw new Error('Cloudflare returned an ambiguous API envelope');
            }
            return body;
          }

          function parseWorkers(body) {
            if (!Array.isArray(body.result)) throw new Error('Workers list response was malformed');
            for (const item of body.result) {
              if (!item || typeof item !== 'object' || Array.isArray(item)
                  || (item.id !== undefined && (typeof item.id !== 'string' || item.id.length === 0))) {
                throw new Error('Worker metadata was malformed');
              }
            }
            const matches = body.result.filter((item) => item.id === worker);
            if (matches.length > 1) throw new Error('Worker identity was ambiguous');
            if (matches.length === 0) return null;
            const matched = matches[0];
            if (matched.routes !== undefined && matched.routes !== null && !Array.isArray(matched.routes)) {
              throw new Error('Worker route metadata was malformed');
            }
            if (Array.isArray(matched.routes) && matched.routes.length !== 0) {
              throw new Error('Worker has an account-reported route');
            }
            return matched;
          }

          function parseWorkerDomains(body) {
            if (!Array.isArray(body.result)) throw new Error('Worker custom-domain response was malformed');
            const info = body.result_info;
            if (info !== undefined) {
              if (!info || typeof info !== 'object' || Array.isArray(info)) {
                throw new Error('Worker custom-domain pagination metadata was malformed');
              }
              for (const field of ['page', 'per_page', 'count', 'total_count', 'total_pages']) {
                if (info[field] !== undefined && (!Number.isInteger(info[field]) || info[field] < 0)) {
                  throw new Error('Worker custom-domain pagination metadata was malformed');
                }
              }
            }
            for (const domain of body.result) {
              if (!domain || typeof domain !== 'object' || Array.isArray(domain)
                  || domain.service !== worker) {
                throw new Error('Worker custom-domain metadata was malformed');
              }
            }
            if (body.result.length !== 0) throw new Error('Worker has a custom domain');
            if ((info?.count ?? 0) > 0) {
              throw new Error('Worker custom-domain count contradicted the empty filtered result');
            }
          }

          function parseVersions(body) {
            if (!body.result || typeof body.result !== 'object' || Array.isArray(body.result)
                || !Array.isArray(body.result.items)) throw new Error('Worker version response was malformed');
            const ids = [];
            for (const item of body.result.items) {
              if (!item || typeof item !== 'object' || Array.isArray(item)) throw new Error('Worker version metadata was malformed');
              if (item.id !== undefined) {
                if (typeof item.id !== 'string' || item.id.length === 0) throw new Error('Worker version ID was malformed');
                ids.push(item.id);
              }
            }
            if (new Set(ids).size !== ids.length) throw new Error('Worker version IDs were duplicated');
            if (body.result.items.length > 0
                && (typeof body.result.items[0].id !== 'string' || body.result.items[0].id.length === 0)) {
              throw new Error('Latest Worker version ID was unavailable');
            }
            return body.result.items[0]?.id ?? null;
          }

          function parseAccountSubdomain(body, workerName) {
            if (!body.result || typeof body.result !== 'object' || Array.isArray(body.result)
                || !Object.hasOwn(body.result, 'subdomain')
                || typeof body.result.subdomain !== 'string' || body.result.subdomain !== 'nivasa-app') {
              throw new Error('Workers.dev account namespace is unexpected');
            }
            if (workerName !== 'nivasa-home-help') throw new Error('Unexpected Worker name');
            const publicUrl = `https://${workerName}.${body.result.subdomain}.workers.dev`;
            if (publicUrl !== 'https://nivasa-home-help.nivasa-app.workers.dev') {
              throw new Error('Derived Workers.dev URL is unexpected');
            }
            return publicUrl;
          }
          const publicUrl = parseAccountSubdomain(await get(`/accounts/${account}/workers/subdomain`), worker);
          const scripts = await get(`/accounts/${account}/workers/scripts`);
          const matchedWorker = parseWorkers(scripts);
          const workerExists = matchedWorker !== null;

          const managed = await get(`/accounts/${account}/r2/buckets/${process.env.EXPECTED_BUCKET_NAME}/domains/managed`);
          const customR2 = await get(`/accounts/${account}/r2/buckets/${process.env.EXPECTED_BUCKET_NAME}/domains/custom`);
          if (managed.result?.enabled !== false || !Array.isArray(customR2.result?.domains)
              || customR2.result.domains.length !== 0) throw new Error('R2 bucket is not private');

          const domains = await get(
            `/accounts/${account}/workers/domains?service=${encodeURIComponent(worker)}`,
            false,
            true,
          );
          parseWorkerDomains(domains);

          let secretNames = [];
          let versionId = null;
          let workersDevEnabled = false;
          if (workerExists) {
            const subdomain = await get(`/accounts/${account}/workers/scripts/${worker}/subdomain`);
            if (typeof subdomain.result?.enabled !== 'boolean' || subdomain.result?.previews_enabled !== false) {
              throw new Error('Worker subdomain or preview metadata is unexpected');
            }
            workersDevEnabled = subdomain.result.enabled;
            if (process.env.REQUIRE_ACCESS_STATE === 'private' && workersDevEnabled) {
              throw new Error('Worker is unexpectedly public');
            }
            if (process.env.REQUIRE_ACCESS_STATE === 'public' && !workersDevEnabled) {
              throw new Error('Workers.dev access is not enabled');
            }
            const settings = await get(`/accounts/${account}/workers/scripts/${worker}/settings`);
            const bindings = settings.result?.bindings;
            if (!Array.isArray(bindings)) throw new Error('Worker binding metadata was malformed');
            const requireBinding = (name, type, property, value) => {
              const found = bindings.filter((binding) => binding?.name === name && binding?.type === type);
              if (found.length !== 1 || (property && found[0][property] !== value)) throw new Error(`Unexpected ${name} binding metadata`);
            };
            requireBinding('DB', 'd1', 'database_id', process.env.EXPECTED_DATABASE_ID);
            requireBinding('BUCKET', 'r2_bucket', 'bucket_name', process.env.EXPECTED_BUCKET_NAME);
            requireBinding('ASSETS', 'assets');
            requireBinding('IMAGES', 'images');
            secretNames = bindings.filter((binding) => binding?.type === 'secret_text').map((binding) => binding.name).sort();
            if (secretNames.some((name) => !expectedSecrets.includes(name)) || new Set(secretNames).size !== secretNames.length) {
              throw new Error('Worker secret-name metadata is unexpected');
            }
            const versions = await get(`/accounts/${account}/workers/scripts/${worker}/versions`);
            versionId = parseVersions(versions);
          }
          if (process.env.REQUIRE_WORKER === '1' && !workerExists) throw new Error('Expected Worker does not exist');
          if (process.env.REQUIRE_ALL_SECRETS === '1'
              && JSON.stringify(secretNames) !== JSON.stringify(expectedSecrets)) throw new Error('Expected Worker secret names are incomplete');
          const state = { workerExists, secretNames, versionId, publicUrl, workersDevEnabled, previewsEnabled: false, r2Private: true };
          fs.writeFileSync(process.env.STATE_PATH, JSON.stringify(state), { mode: 0o600 });
          console.log(workerExists ? 'Existing exact Worker state verified.' : 'No conflicting Worker exists.');
          NODE
          chmod 600 "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs"

          cat > "${RUNNER_TEMP}/nivasa-validate-d1.mjs" <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const { parsePendingMigrationOutput, requireDeploymentReady } = await import(
            pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/production-migration-contract.mjs`).href
          );
          const temp = process.env.RUNNER_TEMP;
          const infoDocument = JSON.parse(fs.readFileSync(`${temp}/nivasa-d1-info.json`, 'utf8'));
          const info = infoDocument.result ?? infoDocument;
          if ((info.uuid ?? info.database_id) !== process.env.EXPECTED_DATABASE_ID
              || info.name !== process.env.EXPECTED_DATABASE_NAME) throw new Error('Remote D1 identity is unexpected');
          const blocks = JSON.parse(fs.readFileSync(`${temp}/nivasa-d1-ledger.json`, 'utf8'));
          if (!Array.isArray(blocks) || blocks.length === 0
              || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
            throw new Error('Remote D1 ledger response was ambiguous');
          }
          const actual = blocks.flatMap((block) => block.results).map((row) => row.name);
          const pending = parsePendingMigrationOutput(fs.readFileSync(`${temp}/nivasa-pending-migrations.txt`, 'utf8'));
          requireDeploymentReady({ applied: actual, pending });
          console.log('Remote D1 identity and complete 13-entry ledger verified; zero migrations pending.');
          NODE
          chmod 600 "${RUNNER_TEMP}/nivasa-validate-d1.mjs"

          run_d1_checks() {
            ./node_modules/.bin/wrangler d1 info DB --config wrangler.jsonc --json > "${RUNNER_TEMP}/nivasa-d1-info.json"
            ./node_modules/.bin/wrangler d1 migrations list DB --config wrangler.jsonc --remote > "${RUNNER_TEMP}/nivasa-pending-migrations.txt"
            ./node_modules/.bin/wrangler d1 execute DB --config wrangler.jsonc --remote --json \
              --command 'SELECT name FROM d1_migrations ORDER BY id' > "${RUNNER_TEMP}/nivasa-d1-ledger.json"
            node "${RUNNER_TEMP}/nivasa-validate-d1.mjs"
          }

          STATE_PATH="${RUNNER_TEMP}/nivasa-preflight-state.json" REQUIRE_WORKER=1 REQUIRE_ALL_SECRETS=1 REQUIRE_ACCESS_STATE=either \
            node "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs"
          run_d1_checks

          if [[ "${REQUESTED_OPERATION}" == 'preflight' ]]; then
            echo 'Read-only production deployment preflight completed.'
            exit 0
          fi

          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" && -z "$(git status --porcelain)" ]] || {
            echo 'Repository state changed after preflight.' >&2
            exit 1
          }
          reviewed_hash="$(cat "${RUNNER_TEMP}/nivasa-reviewed-config.sha256")"
          current_hash="$(sha256sum wrangler.jsonc)"
          current_hash="${current_hash%% *}"
          [[ "${current_hash}" == "${reviewed_hash}" ]] || {
            echo 'Production configuration changed after review.' >&2
            exit 1
          }
          grep -Eq 'productionReadinessResponse\(request, env, true\)' dist/server/index.js || {
            echo 'The reviewed production artifact is unavailable.' >&2
            exit 1
          }
          reviewed_artifact_hash="$(cat "${RUNNER_TEMP}/nivasa-reviewed-artifact.sha256")"
          artifact_hash="$(find dist .wrangler/deploy/config.json -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          artifact_hash="${artifact_hash%% *}"
          [[ "${artifact_hash}" == "${reviewed_artifact_hash}" ]] || {
            echo 'The production artifact changed after validation.' >&2
            exit 1
          }
          STATE_PATH="${RUNNER_TEMP}/nivasa-fresh-state.json" REQUIRE_WORKER=1 REQUIRE_ALL_SECRETS=1 REQUIRE_ACCESS_STATE=either \
            node "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs"
          cmp --silent "${RUNNER_TEMP}/nivasa-preflight-state.json" "${RUNNER_TEMP}/nivasa-fresh-state.json" || {
            echo 'Remote Worker state changed after preflight.' >&2
            exit 1
          }
          run_d1_checks
          ./node_modules/.bin/wrangler deploy --strict
          STATE_PATH="${RUNNER_TEMP}/nivasa-post-deploy-state.json" REQUIRE_WORKER=1 REQUIRE_ALL_SECRETS=1 REQUIRE_ACCESS_STATE=public \
            node "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs"
          echo 'Exact Worker artifact deployed with Workers.dev enabled and previews disabled.'

      - name: Verify final public deployment
        if: ${{ inputs.operation == 'deploy-public' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          STATE_PATH="${RUNNER_TEMP}/nivasa-final-state.json" REQUIRE_WORKER=1 REQUIRE_ALL_SECRETS=1 REQUIRE_ACCESS_STATE=public \
            node "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs"
          ./node_modules/.bin/wrangler d1 migrations list DB --config wrangler.jsonc --remote \
            > "${RUNNER_TEMP}/nivasa-final-pending.txt"
          ./node_modules/.bin/wrangler d1 execute DB --config wrangler.jsonc --remote --json \
            --command 'SELECT name FROM d1_migrations ORDER BY id' > "${RUNNER_TEMP}/nivasa-final-ledger.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            parsePendingMigrationOutput,
            requireDeploymentReady,
          } from './scripts/production-migration-contract.mjs';
          const blocks = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/nivasa-final-ledger.json`, 'utf8'));
          if (!Array.isArray(blocks) || blocks.length === 0
              || blocks.some((block) => block.success !== true || !Array.isArray(block.results))) {
            throw new Error('Final D1 ledger response was ambiguous');
          }
          const actual = blocks.flatMap((block) => block.results).map((row) => row.name);
          const pending = parsePendingMigrationOutput(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/nivasa-final-pending.txt`, 'utf8'),
          );
          requireDeploymentReady({ applied: actual, pending });
          NODE
          version_id="$(node -e "const s=JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/nivasa-final-state.json')); if(!s.versionId)process.exit(1); process.stdout.write(s.versionId)")"
          verified_url="$(node -e "const s=JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/nivasa-final-state.json')); if(s.publicUrl!==process.env.EXPECTED_WORKERS_DEV_URL)process.exit(1); process.stdout.write(s.publicUrl)")"
          echo "Verified public Worker version: ${version_id}"
          echo "Workers.dev production URL verified from live account namespace: ${verified_url}"
          echo 'Final Worker bindings, secret names, D1 ledger, R2 privacy, Workers.dev access, and preview isolation verified.'

      - name: Remove temporary deployment material
        if: ${{ always() }}
        run: |
          rm -f -- \
            "${RUNNER_TEMP}/nivasa-inspect-cloudflare.mjs" \
            "${RUNNER_TEMP}/nivasa-validate-d1.mjs" \
